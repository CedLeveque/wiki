name: Deploy AsciiDoc Wiki

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: gem install asciidoctor

      - name: Build HTML from AsciiDoc
        run: |
          mkdir -p public
          # Activation des options Bash pour gérer les sous-dossiers et éviter de planter si aucun fichier n'est trouvé
          shopt -s globstar nullglob
          
          # Compilation des fichiers situés dans docs/src/
          asciidoctor -D public docs/src/**/*.adoc docs/src/*.adoc

          # Création d'une page index.html automatique si aucune n'est présente
          if [ ! -f public/index.html ]; then
            echo "<!DOCTYPE html><html><head><title>Wiki Procedures</title></head><body><h1>Index des procédures</h1><ul>" > public/index.html
            for f in public/*.html; do
              [ -e "$f" ] || continue
              filename=$(basename "$f")
              if [ "$filename" != "index.html" ]; then
                echo "<li><a href=\"$filename\">${filename%.html}</a></li>" >> public/index.html
              fi
            done
            echo "</ul></body></html>" >> public/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4