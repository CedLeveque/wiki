name: Deploy AsciiDoc Wiki

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: gem install asciidoctor
      - name: Build HTML from AsciiDoc
        run: |
          mkdir -p public
          echo "=== Contenu du répertoire courant ==="
          ls -la
          echo "=== Contenu de src/ (si présent) ==="
          ls -la src/ || echo "Le dossier src n'existe pas à la racine !"
          
          echo "=== Lancement de la compilation ==="
          asciidoctor -D public src/*.adoc || asciidoctor -D public src/**/*.adoc || echo "Aucun fichier adoc trouvé"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
